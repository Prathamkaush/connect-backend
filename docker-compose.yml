services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masters
      POSTGRES_USER: masters
      POSTGRES_PASSWORD: masters
    ports: ["5434:5432"]
    volumes: ["masters_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masters -d masters"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["masters_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://masters:masters@postgres:5432/masters?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  masters_postgres:
  masters_redis:
